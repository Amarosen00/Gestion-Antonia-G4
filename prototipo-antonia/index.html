<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio de sesión · Antonia Centro de Estética</title>
<link rel="stylesheet" href="static/bootstrap.min.css">
<link rel="stylesheet" href="static/bootstrap-icons.min.css">
<link rel="stylesheet" href="static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23BE185D'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand fs-2">Antonia<span class="dot">.</span></div>
      <div class="text-muted">Centro de Estética · Sistema de gestión</div>
    </div>
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3">Iniciar sesión</h1>
      <div id="err" class="alert alert-danger d-none py-2" role="alert"><i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos.</div>
      <form id="login" data-go="agenda.html" novalidate>
        <div class="mb-3"><label class="form-label" for="u">Usuario</label>
          <input class="form-control" id="u" name="u" autocomplete="username" required placeholder="Ej.: recepcion.mallplaza">
          <div class="invalid-feedback">Ingresa tu usuario.</div></div>
        <div class="mb-3"><label class="form-label" for="p">Contraseña</label>
          <div class="input-group"><input class="form-control" id="p" name="p" type="password" autocomplete="current-password" required>
          <button class="btn btn-outline-secondary" type="button" id="ver" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
          <div class="invalid-feedback">Ingresa tu contraseña.</div></div></div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
      </form>
    </div></div>
  </div>
</main>
<script src="static/bootstrap.bundle.min.js"></script>
<script src="static/app.js"></script>
<script>
document.getElementById("ver").addEventListener("click", function () {
  var p = document.getElementById("p"); p.type = p.type === "password" ? "text" : "password";
});
document.getElementById("login").addEventListener("submit", function () {
  document.getElementById("err").classList.toggle("d-none", this.checkValidity());
});
</script>
</body></html>
